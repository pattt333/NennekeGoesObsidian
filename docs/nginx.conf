# nginx.conf snippet for Docsify deployment
#
# This configuration serves the TTRPG Rulebook vault using nginx web server.
# Add this server block to your nginx configuration.
#
# Usage:
#   1. Add this server block to your nginx.conf or sites-available config
#   2. Replace 'rules.yourdomain.com' with your actual subdomain
#   3. Adjust the root path to point to your vault directory
#   4. Test config: nginx -t
#   5. Reload nginx: nginx -s reload
#
# For local testing:
#   Use a simple server block with listen 8080;

server {
    listen 80;
    listen [::]:80;
    server_name rules.yourdomain.com;

    # Redirect HTTP to HTTPS (uncomment for production)
    # return 301 https://$server_name$request_uri;

    root /path/to/NennekeObsidian/vault;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(css|js|ico|png|jpg|jpeg|gif|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}

