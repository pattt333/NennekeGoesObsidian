name: Regelbuch-PDF

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pandoc einrichten
        uses: r-lib/actions/setup-pandoc@v2

      - name: Typst einrichten
        uses: typst-community/setup-typst@v5

      - name: Regelbuch prüfen
        run: |
          npm run rulebook:test
          npm run validate:metadata
          npm run validate:links
          npm run validate:orphans

      - name: PDF erzeugen
        run: npm run pdf

      - name: PDF als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Nenneke-PDF
          path: build/Nenneke.pdf
          if-no-files-found: error

  release-pdf:
    name: Regelbuch-Release veröffentlichen
    needs: build-pdf
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: regelbuch-release-main
      cancel-in-progress: false

    steps:
      - name: Repository samt Tags auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Nächste Regelwerksversion bestimmen
        id: version
        shell: bash
        run: |
          git fetch --force --tags
          latest_tag="$(git tag --list --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"

          if [[ -z "$latest_tag" ]]; then
            release_tag="v6.3.1"
          else
            IFS=. read -r major minor patch <<< "${latest_tag#v}"
            release_tag="v${major}.${minor}.$((10#$patch + 1))"
          fi

          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "filename=Nenneke-$release_tag.pdf" >> "$GITHUB_OUTPUT"

      - name: PDF für Release herunterladen
        uses: actions/download-artifact@v4
        with:
          name: Nenneke-PDF
          path: release

      - name: GitHub Release mit PDF erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "release/Nenneke.pdf#${{ steps.version.outputs.filename }}" \
            --target "${{ github.sha }}" \
            --title "Nenneke ${{ steps.version.outputs.tag }}" \
            --generate-notes
